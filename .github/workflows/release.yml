# The one place to release the SDK: Actions > Release > Run workflow.
#
# Each artifact's version comes from the repository. The plan job asks the
# registries which of them are published, and a release publishes the
# rest. A dry run (the default) builds, tests and packages every selected
# artifact, published or not, and stops before each upload, so it can run
# at any time, from any branch. Real releases run from main only.
#
#   crates  gl-client, gl-util, gl-plugin, gl-signerproxy, gl-cli, gl-sdk,
#           gl-sdk-cli to crates.io                    publish-crates.yml
#   python  gl-client and gl-sdk to PyPI                       python.yml
#   npm     @greenlightcln/glsdk to npm                    typescript.yml
#   swift   GreenlightSDK, through Blockstream/gl-sdk-swift     swift.yml
#   maven   com.blockstream:glsdk to Maven Central             kotlin.yml
#
# The crates go first, then the bindings in parallel, so a binding never
# ships a gl-sdk version whose crates failed to publish. Every step skips
# what its registry already has, so re-running a partly failed release
# publishes what is missing.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check everything, publish nothing'
        type: boolean
        default: true
      crates:
        description: 'Rust crates (crates.io)'
        type: boolean
        default: true
      python:
        description: 'gl-client and gl-sdk (PyPI)'
        type: boolean
        default: true
      npm:
        description: '@greenlightcln/glsdk (npm)'
        type: boolean
        default: true
      swift:
        description: 'GreenlightSDK (gl-sdk-swift)'
        type: boolean
        default: true
      maven:
        description: 'com.blockstream:glsdk (Maven Central)'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

run-name: ${{ inputs.dry_run && 'Release dry run' || 'Release' }} from ${{ github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      gl_client_py: ${{ steps.plan.outputs.gl_client_py }}
      gl_sdk_py: ${{ steps.plan.outputs.gl_sdk_py }}
      npm: ${{ steps.plan.outputs.npm }}
      swift: ${{ steps.plan.outputs.swift }}
      maven: ${{ steps.plan.outputs.maven }}
    steps:
      - name: Real releases run from main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releasing from $GITHUB_REF, release from main or start a dry run"
          exit 1

      - uses: actions/checkout@v4

      - id: plan
        run: |
          SELECT=""
          for G in crates python npm swift maven; do
            case "$G" in
              crates) ON=${{ inputs.crates }} ;;
              python) ON=${{ inputs.python }} ;;
              npm) ON=${{ inputs.npm }} ;;
              swift) ON=${{ inputs.swift }} ;;
              maven) ON=${{ inputs.maven }} ;;
            esac
            [ "$ON" = true ] && SELECT="$SELECT,$G"
          done
          python3 .github/scripts/release_plan.py --select "${SELECT#,}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

  crates:
    needs: plan
    if: needs.plan.outputs.crates != ''
    uses: ./.github/workflows/publish-crates.yml
    with:
      crates: ${{ needs.plan.outputs.crates }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
    permissions:
      contents: write

  # The bindings wait for the crates, but also run when there were none to
  # publish.
  python:
    needs: [plan, crates]
    if: >-
      !failure() && !cancelled() &&
      (needs.plan.outputs.gl_client_py == 'true' || needs.plan.outputs.gl_sdk_py == 'true')
    uses: ./.github/workflows/python.yml
    with:
      release: true
      dry_run: ${{ inputs.dry_run }}
      gl_client: ${{ needs.plan.outputs.gl_client_py == 'true' }}
      gl_sdk: ${{ needs.plan.outputs.gl_sdk_py == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  npm:
    needs: [plan, crates]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.npm == 'true' }}
    uses: ./.github/workflows/typescript.yml
    with:
      release: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
    permissions:
      contents: read

  swift:
    needs: [plan, crates]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.swift == 'true' }}
    uses: ./.github/workflows/swift.yml
    with:
      release: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
    permissions:
      contents: write

  maven:
    needs: [plan, crates]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.maven == 'true' }}
    uses: ./.github/workflows/kotlin.yml
    with:
      release: true
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
    permissions:
      contents: write
