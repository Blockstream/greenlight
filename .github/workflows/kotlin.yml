# The full build cross compiles the sdk for eleven release targets and
# then runs the gradle build, 75 to 115 minutes on a macOS runner, and
# publishes nothing on a PR. So PRs pay for it only when they touch the
# bindings or the build itself, and every other PR is not gated by this
# check at all; branch protection requires just `linux`, not this check.
# The build runs always for pushes to main, the gl-sdk release tags and
# manual runs. The push trigger used to name `master`, a branch this
# repository no longer has, so a merged PR was never built afterwards;
# `main` below closes that gap.

on:
  push:
    branches:
      - main
    tags:
      - 'gl-sdk-*'
  pull_request:
    paths:
      - 'libs/gl-sdk*/**'
      - 'libs/uniffi-bindgen/**'
      - 'libs/proto/**'
      - 'build/**'
      - 'Cargo.toml'
      - 'Taskfile.yml'
      - '.github/workflows/kotlin.yml'
  workflow_dispatch:

name: Kotlin library

jobs:

  build:
    runs-on: macos-26
    steps:
      - name: "Show default version of NDK"
        run: echo $ANDROID_NDK_ROOT

      - name: "Check out PR branch"
        uses: actions/checkout@v4

      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-linux-android, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu, aarch64-pc-windows-msvc, x86_64-pc-windows-msvc
          # cargo-xwin archives the Windows libraries with the llvm-ar of llvm-tools
          components: llvm-tools

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: "Install NDK"
        run: |
          cargo install cargo-ndk --version 3.5.4

      # cargo-zigbuild cross builds the Linux libraries of the jvm jar with zig
      - name: "Install zig"
        run: |
          brew install zig

      - name: "Build Kotlin Multiplatform bindings"
        run: |
          /usr/local/bin/task build:kotlin

      - name: "Build Android library"
        working-directory: libs/gl-sdk-android
        run: |
          ./gradlew :lib:assemble --console=plain

      - name: "Test JVM library"
        working-directory: libs/gl-sdk-android
        run: |
          ./gradlew :lib:jvmTest --console=plain

      - name: "Publish to Maven"
        working-directory: libs/gl-sdk-android
        run: |
          ./gradlew :lib:publishToMavenLocal

      - name: Temporarily save artifact
        uses: actions/upload-artifact@v4
        with:
          name: glsdk-artifact
          path: libs/gl-sdk-android/lib/build/outputs/
          retention-days: 14
