[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
resolver = "2"
members = [
    "examples/rust",
    "libs/gl-client",
    "libs/gl-client-py",
    "libs/gl-plugin",
    "libs/gl-signerproxy",
    "libs/gl-cli",
    "libs/gl-util",
    "libs/gl-sdk",
    "libs/uniffi-bindgen",
    "libs/gl-sdk-napi",
    "libs/gl-sdk-cli",
]

[workspace.dependencies]
anyhow = "1"
env_logger = "0.10"
cln-grpc = "0.4"
cln-rpc = "0.4"
cln-plugin = "0.4"
tonic = "0.11"

vls-core = "=1.0.0-rc.1"
vls-persist = "=1.0.0-rc.1"
vls-protocol-signer = "=1.0.0-rc.1"
vls-protocol = "=1.0.0-rc.1"
