[package]
name = "gl-sdk"
version = "0.4.0"
edition = "2024"
description = "High-level SDK for Greenlight with UniFFI language bindings"
license = "MIT"
repository = "https://github.com/Blockstream/greenlight"

[features]
experimental-splicing = ["gl-client/experimental-splicing"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "glsdk"

[dependencies]
anyhow = { workspace = true }
bip39 = "2.2.0"
bitcoin = { version = "0.32", features = ["base64"] }
gl-client = { version = "0.6.0", path = "../gl-client" }
hex = { workspace = true }
log = { workspace = true }
lightning-invoice = "0.33"
once_cell = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.17"
tokio = { version = "1", features = ["sync"] }
tonic.workspace = true
tracing = { version = "0.1.43", features = ["async-await", "log"] }
uniffi = { version = "0.29.4" }
url = "2"

[build-dependencies]
uniffi = { version = "0.29.4", features = [ "build" ] }
