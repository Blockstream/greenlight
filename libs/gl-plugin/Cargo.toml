[package]
name = "gl-plugin"
version = "0.3.1"
edition = "2021"
authors = ["Christian Decker", "The Greenlight Team"]
description = "Python bindings for the Greenlight client library."
repository = "https://github.com/Blockstream/greenlight"
license = "MIT"

[[bin]]
name = "gl-plugin"
path = "src/bin/plugin.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
base64 = "0.22"
bytes = { version = "1", features = ["serde"] }
clightningrpc = "0.2"
cln-grpc = { workspace = true, features = ["server"] }
cln-plugin = { workspace = true }
cln-rpc = { workspace = true }
env_logger = "0.11"
futures = "0.3"
gl-client = { version = "^0.6.0", path = "../gl-client" }
gl-util = { version = "0.1", path = "../gl-util" }
governor = { version = "0.5", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
http-body-util = "0.1"
lazy_static = "^1.4.0"
linemux = "0.2"
log = "0.4"
prost = "0.14"
tonic-prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sled = "0.34"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["codec"] }
tonic = { version = "0.14", features = ["tls-ring", "transport"] }
tower = { version = "0.5" }
vls-protocol = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"
