version: "3"

tasks:
  android:
    deps:
      - linux-android-aarch64
      - linux-androideabi-armv7
      - linux-android-i686
      - linux-android-x86_64
    cmds:
      - cp -a target/release/android/jniLibs libs/gl-sdk-android/lib/src/androidMain

  kotlin:
    deps:
      - android
      - ios
      - ios-sim
    vars:
      OS_NAME:
        sh: uname | tr '[:upper:]' '[:lower:]'
      # gobley 0.3.7 misreads u8/u16 return values on 32-bit ARM Android, which fails the UniFFI
      # checksum check once the app is AOT-compiled (https://github.com/gobley/gobley/issues/252).
      # This revision carries the fix proposed upstream in https://github.com/gobley/gobley/pull/297.
      GOBLEY_GIT: https://github.com/angelix/gobley
      GOBLEY_REV: 40cef27c59829ca97a71945928028f9ab4880305
      GOBLEY_ROOT: target/gobley
    cmds:
      - cargo install --locked --git {{.GOBLEY_GIT}} --rev {{.GOBLEY_REV}} --root {{.GOBLEY_ROOT}} --bin gobley-uniffi-bindgen gobley-uniffi-bindgen
      - "{{.GOBLEY_ROOT}}/bin/gobley-uniffi-bindgen --config ./libs/gl-sdk/uniffi.kotlin-multiplatform.toml --library ./target/aarch64-linux-android/debug/libglsdk.a --out-dir target/release/kotlin-multiplatform"
      - cp -a ./target/release/kotlin-multiplatform/* libs/gl-sdk-android/lib/src/
      - mkdir -p libs/gl-sdk-android/lib/src/lib/ios-arm64
      - mkdir -p libs/gl-sdk-android/lib/src/lib/ios-simulator-arm64
      - cp ./target/aarch64-apple-ios/release/libglsdk.a libs/gl-sdk-android/lib/src/lib/ios-arm64/
      - cp ./target/aarch64-apple-ios-sim/release/libglsdk.a libs/gl-sdk-android/lib/src/lib/ios-simulator-arm64/
      - cp -a {{.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/{{.OS_NAME}}-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so libs/gl-sdk-android/lib/src/androidMain/jniLibs/arm64-v8a/
      - cp -a {{.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/{{.OS_NAME}}-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so libs/gl-sdk-android/lib/src/androidMain/jniLibs/armeabi-v7a/
      - cp -a {{.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/{{.OS_NAME}}-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so libs/gl-sdk-android/lib/src/androidMain/jniLibs/x86/
      - cp -a {{.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/{{.OS_NAME}}-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so libs/gl-sdk-android/lib/src/androidMain/jniLibs/x86_64/

  swift:
    deps:
      - ios
      - ios-sim
    cmds:
      - cargo run --bin uniffi-bindgen -- generate --library ./target/aarch64-apple-ios/release/libglsdk.a --language swift --out-dir ./target/swift
      - xcodegen generate --spec build/project.yml --project ./libs/gl-sdk-swift
      - xcodebuild archive -project libs/gl-sdk-swift/GreenlightBindings.xcodeproj -scheme glsdkFFI -archivePath "./target/ios.xcarchive" -sdk iphoneos -destination "generic/platform=iOS"
      - xcodebuild archive -project libs/gl-sdk-swift/GreenlightBindings.xcodeproj -scheme glsdkFFI -archivePath "./target/ios_sim.xcarchive" -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
      - xcodebuild -create-xcframework -framework "./target/ios.xcarchive/Products/Library/Frameworks/glsdkFFI.framework" -framework "./target/ios_sim.xcarchive/Products/Library/Frameworks/glsdkFFI.framework" -output "./target/glsdkFFI.xcframework"

  linux-*-*:
    vars:
      ABI: '{{index .MATCH 0}}'
      ARCH: '{{index .MATCH 1}}'
    cmds:
      - cargo ndk -t {{.ARCH}}-linux-{{.ABI}} -o target/release/android/jniLibs build -p gl-sdk

  ios:
    deps:
      - ios-apple-aarch64

  ios-sim:
    deps:
      - ios-sim-apple-aarch64
      - ios-apple-x86_64
    cmds:
      - mkdir -p target/lipo-ios-sim/release
      - lipo -create target/aarch64-apple-ios-sim/release/libglsdk.a target/x86_64-apple-ios/release/libglsdk.a -output target/lipo-ios-sim/release/libglsdk.a

  ios-apple-*:
    vars:
      ARCH: '{{ index .MATCH 0 }}'
    cmds:
      - IPHONEOS_DEPLOYMENT_TARGET=12.0 MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --target {{.ARCH}}-apple-ios -p gl-sdk

  ios-sim-apple-*:
    vars:
      ARCH: '{{ index .MATCH 0 }}'
    cmds:
      - IPHONEOS_DEPLOYMENT_TARGET=12.0 MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release --target {{.ARCH}}-apple-ios-sim -p gl-sdk
